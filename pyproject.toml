[project]
name = "four"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alphafour-engine",
    "numpy",
    "torch",
    "tqdm",
]

[tool.uv.sources]
alphafour-engine = { path = "rust", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:`torch\\.jit\\.script_method` is deprecated:DeprecationWarning:torch\\.jit\\._script",
]

[dependency-groups]
dev = [
    "maturin>=1.7,<2.0",
    "pytest>=9.0.3",
]
