[package]
name = "alphafour-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "alphafour_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.24", features = ["abi3-py312"] }
numpy = "0.24"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
