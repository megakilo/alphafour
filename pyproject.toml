[project]
name = "four"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cython>=3.0",
    "numpy",
    "setuptools>=81.0.0",
    "torch",
    "tqdm",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:`torch\\.jit\\.script_method` is deprecated:DeprecationWarning:torch\\.jit\\._script",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
